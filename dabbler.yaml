# dabbler.yaml -- what this repository declares about itself.
#
# Tracked, unlike local-overrides.yaml, because CI reads these facts and so
# does the next machine to pick up a session. Precedence is the packaged
# router-config.yaml, then this file, then local-overrides.yaml. Providers,
# models, roles and transports are deliberately absent: those are
# distribution facts, and a repository that restated them here would fork
# the model registry in order to say how to run a test suite.
schema_version: 1
posture: maintenance  # 44 tracked source or build file(s) when bootstrap ran (Store.Data/Store.Data.csproj): the framework fits itself to them and writes no root build files. Changing this word to greenfield changes it.

# No suite is declared, because nothing in this repository says how its
# tests run. Setup reads what is there -- a pytest section, a
# `scripts.test`, a POM or a solution at the root or two levels below it
# -- and where none of it says how the tests run, it declares nothing
# rather than emitting a command that would fail on its first use. That is
# a declaration, not an omission.
#
# Declare the suite yourself -- a name, the command that runs it, the paths
# it covers, and where its tests live:
#
#   testing:
#     suites:
#       - name: python
#         command: python -m pytest
#         expensive: true
#         covers: ["."]
#         test_roots: [tests]
#         test_glob: "test_*.py"

testing:
  # vstest from the Visual Studio installation vswhere names, over the MSTest
  # project Store.Service.Tests, whose adapter package makes it discoverable.
  # The compile control builds the assembly before the suite runs.
  suites:
    - name: dotnet-framework
      command: '{vstest} "Store.Service.Tests\bin\Debug\Store.Service.Tests.dll" "/logger:console;verbosity=minimal"'
      expensive: true
      covers:
        - "."
      test_roots:
        - "."
      test_glob: ["*Test.cs", "*Tests.cs"]
      test_name: ["{name}Test.cs", "{name}Tests.cs"]
      select: '{vstest} "Store.Service.Tests\bin\Debug\Store.Service.Tests.dll" "/logger:console;verbosity=minimal" /TestCaseFilter:FullyQualifiedName~{names}'
      select_separator: "|FullyQualifiedName~"
  # MSBuild from the Visual Studio installation vswhere names on this
  # machine: `{msbuild}` is filled in when the control runs, and the record
  # says which MSBuild it was.
  controls:
    - kind: compile
      command: '{msbuild} "Store.sln" /restore /t:Build /p:RestorePackagesConfig=true /p:Configuration=Debug /v:minimal /nologo'
      required: true

# Step (f) of the lifecycle: pack, then push to a feed. A session that
# declared itself releasable publishes through these -- both argv, never
# shell strings, and `push` naming the credential rather than holding it.
# This repository declares none, and that is the declaration: it publishes
# to no feed today. A feed that is a folder on disk -- a drive path, a UNC
# path or file:// -- takes no credential: leave `secret` out, and the push
# runs without one. `dabbler packaging --dry-run` rehearses the block and
# exits 0 when it loads, in a session that may not publish too;
# `dabbler packaging --rehearse` runs the pack and pushes nothing.
#
#   packaging:
#     pack:
#       argv: ["dotnet", "pack", "-c", "Release", "-o", "{output}"]
#     push:
#       argv: ["dotnet", "nuget", "push", "{artifact}",
#              "--source", "{feed}", "--api-key", "{secret}"]
#       feed: https://pkgs.dev.azure.com/<org>/_packaging/<feed>/nuget/v3/index.json
#       secret: DABBLER_FEED_PAT
